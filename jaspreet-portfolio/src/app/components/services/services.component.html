<section id="services" class="relative py-24 sm:py-32">
  <div class="max-w-7xl mx-auto px-6 lg:px-10">
    <div class="text-center max-w-2xl mx-auto reveal">
      <span class="section-eyebrow">What I offer</span>
      <h2 class="section-heading mt-3">Services</h2>
    </div>

    <div class="mt-16 grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (service of services; track service.title) {
        <div class="glass-card p-7 reveal group">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-signal-blue/20 to-signal-purple/20 border border-white/10 flex items-center justify-center mb-5 group-hover:scale-110 group-hover:shadow-glow transition-all duration-300">
            <lucide-icon [img]="iconFor(service.icon)" [size]="20" class="text-signal-cyan"></lucide-icon>
          </div>
          <h3 class="font-display text-base font-semibold text-ink-100">{{ service.title }}</h3>
          <p class="text-ink-500 text-sm leading-relaxed mt-2">{{ service.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
