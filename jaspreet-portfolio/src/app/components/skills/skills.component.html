<section id="skills" class="relative py-24 sm:py-32 grid-bg">
  <div class="max-w-7xl mx-auto px-6 lg:px-10">
    <div class="text-center max-w-2xl mx-auto reveal">
      <span class="section-eyebrow">What I work with</span>
      <h2 class="section-heading mt-3">Skills &amp; Technologies</h2>
      <p class="mt-4 text-ink-500">
        A toolkit built for shipping complete products — from interface to database.
      </p>
    </div>

    <div class="mt-16 grid md:grid-cols-2 gap-6">
      @for (category of categories; track category.title) {
        <div class="glass-card p-7 reveal">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-signal-blue/20 to-signal-purple/20 flex items-center justify-center border border-white/10">
              <lucide-icon [img]="iconFor(category.icon)" [size]="18" class="text-signal-cyan"></lucide-icon>
            </div>
            <h3 class="font-display text-lg font-semibold text-ink-100">{{ category.title }}</h3>
          </div>

          <div class="space-y-4">
            @for (skill of category.skills; track skill.name) {
              <div class="group">
                <div class="flex justify-between text-sm mb-1.5">
                  <span class="text-ink-300 group-hover:text-ink-100 transition-colors">{{ skill.name }}</span>
                  <span class="font-mono text-xs text-ink-500">{{ skill.level }}%</span>
                </div>
                <div class="h-1.5 rounded-full bg-white/[0.06] overflow-hidden">
                  <div
                    class="h-full rounded-full bg-gradient-to-r from-signal-blue to-signal-cyan transition-all duration-1000 ease-out"
                    [style.width.%]="skill.level"
                  ></div>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
