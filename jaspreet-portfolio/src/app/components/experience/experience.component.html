<section id="experience" class="relative py-24 sm:py-32">
  <div class="max-w-5xl mx-auto px-6 lg:px-10">
    <div class="text-center max-w-2xl mx-auto reveal">
      <span class="section-eyebrow">How I got here</span>
      <h2 class="section-heading mt-3">My Journey</h2>
    </div>

    <div class="relative mt-16 pl-10 sm:pl-0">
      <!-- vertical line -->
      <div class="absolute left-4 sm:left-1/2 top-0 bottom-0 w-px bg-gradient-to-b from-signal-blue/60 via-signal-purple/40 to-transparent sm:-translate-x-1/2"></div>

      <div class="space-y-12">
        @for (item of timeline; track item.id; let i = $index) {
          <div
            class="relative reveal sm:grid sm:grid-cols-2 sm:gap-10"
            [class.sm:text-right]="i % 2 === 0"
          >
            <!-- dot -->
            <span class="absolute left-4 sm:left-1/2 top-1.5 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-signal-cyan shadow-glow ring-4 ring-base-900"></span>

            <div [class.sm:col-start-1]="i % 2 === 0" [class.sm:col-start-2]="i % 2 !== 0" class="glass-card p-6 sm:max-w-md" [class.sm:ml-auto]="i % 2 === 0">
              <div class="flex items-center gap-3 mb-2" [class.sm:flex-row-reverse]="i % 2 === 0">
                <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center border border-white/10 shrink-0">
                  <lucide-icon [img]="iconFor(item.type)" [size]="15" class="text-signal-cyan"></lucide-icon>
                </div>
                <span class="font-mono text-xs text-signal-blue tracking-widest">{{ item.year }}</span>
              </div>
              <h3 class="font-display text-lg font-semibold text-ink-100">{{ item.title }}</h3>
              <p class="text-sm text-ink-500 font-mono mt-0.5">{{ item.subtitle }}</p>
              <p class="text-ink-300 text-sm leading-relaxed mt-3">{{ item.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
